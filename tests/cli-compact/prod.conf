# Compacted before it ships: `hocon --env=keep prod.conf` works out the
# includes, overrides and +=, and leaves the variables for the server.
include "defaults.conf"
name = grumpy wombat
port = ${?PORT}
plugins += metrics
hosts = ${?L[]}
db { include "db.conf" }
url = "http://"${db.host}":"${port}"/burrow"
