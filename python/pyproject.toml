[build-system]
# 77 for the SPDX `license` string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zig-hocon"
version = "0.1.0"
description = "HOCON for Python, parsed by zig-hocon: pyhocon's API on a Zig library"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lejmr/zig-hocon"

[tool.setuptools]
packages = ["zig_hocon"]

[tool.setuptools.package-data]
# The library is put there by `zig build python`; py.typed says the package
# has its types (PEP 561).
zig_hocon = ["libhocon.so", "libhocon.dylib", "hocon.dll", "py.typed"]

[tool.uv]
# uv rebuilds when these change; the library is no file it would look at.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "zig_hocon/*" }]
