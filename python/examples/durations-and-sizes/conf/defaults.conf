# Durations and sizes as people write them. JSON has neither: to_json() and
# as_dict() give them as the text they are, "30s", and the models read that
# text with zig_hocon.parse_duration and zig_hocon.parse_bytes.
http {
  timeout = 30s
  retry_backoff = 250ms
  keepalive = 2 minutes
  max_body = 10MB          # MB is 1000 * 1000 bytes, MiB 1024 * 1024
}
cache {
  ttl = 1h
  max_size = 512MiB
}
