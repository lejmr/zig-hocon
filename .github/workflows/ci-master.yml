# Informational only: tracks whether we still build against Zig master.
# Not required to pass, kept separate so it never blocks PRs.
name: CI (zig master)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - name: Run tests
        run: zig build test
