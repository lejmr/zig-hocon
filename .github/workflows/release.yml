name: Release

# One button: Actions -> Release -> Run workflow (works from a phone), with
# the version to release. One tag releases everything under that version:
# the Zig package (the tag's tarball is what `zig fetch` takes), libhocon for
# C as a zip per platform, and the Python package on PyPI.
#
# In this order, and nothing is pushed until every test has passed:
#
#   1. refuse a version that shipped already, or that CHANGELOG.md has
#      nothing for (tools/release.sh --check)
#   2. the tests on every system (ci.yml), the wheels on every system and
#      Python (python.yml)
#   3. CHANGELOG.md's [Unreleased] becomes the version, and build.zig.zon,
#      python/pyproject.toml and the README's install line say it; that is
#      committed to main as `chore(release): vX.Y.Z` and tagged vX.Y.Z
#   4. the wheels and the C zips, built from that commit
#   5. the GitHub release: the version's CHANGELOG.md section, every file
#   6. the wheels to PyPI, through Trusted Publishing (PyPI lists this
#      repository, this workflow and the `pypi` environment as publisher)
#
# The tag is made here and only here, so the tag, the version in the files
# and what was published cannot disagree. With dry_run nothing is pushed, no
# release is made, the notes are in the job summary, and the wheels go to
# TestPyPI (environment `testpypi`).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0"
        required: true
      dry_run:
        description: "Push nothing, release nothing; the wheels to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh tools/release.sh --check "${{ inputs.version }}"
      # The release commit goes onto main: run from anywhere else, it would
      # push that branch there.
      - name: Run from main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: echo "::error::a release runs from main, not ${{ github.ref }}" && exit 1

  zig:
    needs: check
    uses: ./.github/workflows/ci.yml

  python:
    needs: check
    uses: ./.github/workflows/python.yml

  release:
    needs: [zig, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The version in every file, CHANGELOG.md's section named after it
        run: sh tools/release.sh "$VERSION"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      - name: Build the wheels and the C zips
        run: |
          zig build wheels
          sh tools/c-dist.sh "$VERSION" dist
          cp zig-out/wheels/*.whl dist/
          ls -l dist

      - name: Release notes
        run: |
          sh tools/release.sh --notes "$VERSION" > notes.md
          test -s notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # ---- nothing above left the runner; from here on it does ----

      - name: Push the release commit and the tag
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: zig-out/wheels/*.whl

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.dry_run && 'testpypi' || 'pypi' }}
      url: ${{ inputs.dry_run && 'https://test.pypi.org/project/zig-hocon/' || 'https://pypi.org/project/zig-hocon/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.dry_run && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # A dry run can be repeated for one version; PyPI keeps what it has.
          skip-existing: ${{ inputs.dry_run }}
